name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  docker:
    # The image builds with a stand-in model; the real one is attached to releases (see docker-publish).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install onnx numpy && python scripts/make_dummy_model.py models/road_damage.onnx
      - run: docker build -t road-damage-api:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 road-damage-api:ci
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -F image=@tests/data/road.jpg localhost:8080/detect
          docker rm -f api
